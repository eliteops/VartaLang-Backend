[project]
name = "vartalang-radar"
version = "0.1.0"
description = "VartaLang Language Opportunity Radar — backend + Streamlit MVP (SerpApi India Hackathon 2026)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Harshit Varshney" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0.33",
    "psycopg[binary]>=3.2",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pip-audit>=2.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Flat layout: packages (`app`, `tests`) live at the repo root.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
